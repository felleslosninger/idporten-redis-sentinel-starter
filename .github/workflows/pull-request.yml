# The shared docs also list the trigger type "edited" so the title check reruns
# on title changes. It is left out on purpose: ticking a box in the PR checklist
# is also an edit and would rerun the full build every time. The checklist has
# its own light workflow (pr-check-checklist.yml) on "edited" instead.

name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

jobs:
  pull-request-checks:
    uses: felleslosninger/github-workflows/.github/workflows/ci-pr-checks-lib.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
