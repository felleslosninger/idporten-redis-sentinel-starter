name: Release

on:
  release:
    types:
      - created

jobs:
  create-release:
    uses: felleslosninger/github-workflows/.github/workflows/ci-build-publish-lib.yml@main
    permissions:
      contents: read
      packages: write
    with:
      # Default is 25. The library targets Java 21 (pom.xml) so applications still on 21 can use it.
      java-version: 21
      package-version: ${{ github.event.release.tag_name }}
      deployment-repository: ${{ github.repository }}
    secrets: inherit
